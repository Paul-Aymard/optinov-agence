[build]
  command = "next build"
  publish = "out"

# L'ancienne page « À propos » (/agence) a été renommée /a-propos : redirection
# permanente pour ne casser aucun lien déjà partagé.
[[redirects]]
  from = "/agence"
  to = "/a-propos"
  status = 301
  force = true

# En-têtes de sécurité (SEC-002) — répliqués ici pour couvrir toutes les réponses,
# y compris les fichiers statiques servis directement par Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
