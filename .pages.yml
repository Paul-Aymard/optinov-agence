# ============================================================================
# OPTINOV — Tableau de bord (Pages CMS : https://pagescms.org)
# Connexion via GitHub sur https://app.pagescms.org
# Tout ce qui est enregistré ici est publié automatiquement sur le site.
# ============================================================================

media:
  input: public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, gif, webp, svg]

content:
  - name: blog
    label: Articles du blog
    type: collection
    path: content/blog
    filename: "{fields.titre|slugify}.md"
    view:
      fields: [titre, categorie, date, aLaUne]
    fields:
      - name: titre
        label: Titre de l'article
        type: string
      - name: categorie
        label: Catégorie
        type: select
        options:
          values:
            - { value: branding, label: "Communication & branding" }
            - { value: marketing-digital, label: "Marketing digital" }
            - { value: ia, label: "Intelligence artificielle & automatisation" }
            - { value: carte-digitale, label: "Carte de visite digitale & networking" }
            - { value: agence, label: "Coulisses & actualités" }
      - name: date
        label: Date de publication
        type: date
      - name: image
        label: Image de couverture
        type: image
      - name: extrait
        label: Résumé court (accroche)
        type: text
      - name: tempsLecture
        label: Temps de lecture (minutes)
        type: number
        default: 5
      - name: auteur
        label: Auteur
        type: string
        default: "L'équipe OPTINOV"
      - name: aLaUne
        label: Mettre à la une
        type: boolean
        default: false
      - name: serviceLie
        label: "Service lié (facultatif — ex : communication-visuelle)"
        type: string
        required: false
      - name: body
        label: Contenu de l'article
        type: rich-text

  - name: images_services
    label: Images des pages Services
    type: file
    path: content/images/services.json
    fields:
      - name: communication-visuelle
        label: Communication visuelle
        type: object
        fields:
          - { name: img1, label: "Bloc « L'identité prend forme »", type: image }
          - { name: img2, label: "Bloc « Votre marque prend la parole »", type: image }
          - { name: img3, label: "Bloc « La preuve par nos réalisations »", type: image }
      - name: communication-digitale
        label: Communication digitale
        type: object
        fields:
          - { name: img1, label: "Bloc « Chaque point de contact compte »", type: image }
          - { name: img2, label: "Bloc « De la visibilité à la confiance »", type: image }
          - { name: img3, label: "Bloc « Des résultats concrets »", type: image }
      - name: marketing-strategie
        label: Marketing & stratégie
        type: object
        fields:
          - { name: img1, label: "Bloc « Faire les bons choix »", type: image }
          - { name: img2, label: "Bloc « Passer à l'action »", type: image }
          - { name: img3, label: "Bloc « Voir les résultats »", type: image }
      - name: automatisation-ia
        label: Performance & automatisation
        type: object
        fields:
          - { name: img1, label: "Bloc « Une entreprise plus simple à gérer »", type: image }
          - { name: img2, label: "Bloc « Des solutions adaptées »", type: image }
          - { name: img3, label: "Bloc « Plus de performance »", type: image }
      - name: photo-video
        label: Photo & Vidéo Corporate
        type: object
        fields:
          - { name: img1, label: "Bloc « Nous capturons l'essentiel »", type: image }
          - { name: img2, label: "Bloc « Des contenus qui vous servent »", type: image }
          - { name: img3, label: "Bloc « Valorisez votre image »", type: image }
